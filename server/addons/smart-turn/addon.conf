# summary: smart-turn: Pipecat's end-of-turn model on top of Silero VAD, so she waits when you pause mid-sentence and answers faster when you are done
server files/core/providers/vad/silero_smartturn.py core/providers/vad/silero_smartturn.py
note Download the model into the server's data folder first: ./addons/smart-turn/fetch-model.sh <server dir> (puts data/smart-turn/smart-turn-v3.2-cpu.onnx).
note Then turn it on: ./addons/smart-turn/switch-vad.sh on <server dir>  (backs up data/.config.yaml, adds the SileroSmartTurn block, restarts). ./addons/smart-turn/switch-vad.sh off goes back to SileroVAD.
