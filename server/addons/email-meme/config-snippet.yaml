# Add under mcp_servers: in your Hermes profile config.yaml. Use full paths.
# No key and no addresses here: the script reads AGENTMAIL_API_KEY from the profile .env at call time
# (NG_ENV_FILE) and the approved addresses from ~/.config/nousgirl/email-meme-allowlist.txt.
mcp_servers:
  nousgirl_emailmeme:
    command: uv
    args: [run, --no-project, --quiet, --python, "3.12", --with, "mcp>=1.2,<2", --with, pillow, python,
           /FULL/PATH/TO/.nous-girl/hermes/email-meme/nousgirl_emailmeme_mcp.py]
    env:
      NG_ENV_FILE: /FULL/PATH/TO/.hermes/profiles/YOUR_PROFILE/.env   # default ~/.hermes/profiles/nous-girl/.env
      # NG_EMAIL_INBOX: YOUR_AGENTMAIL_INBOX_ID    # default: the inbox whose name is "nousgirl"
      # NG_EMAIL_RATE: "10"                        # sends per rolling hour
    enabled: true
    trust: full
    connect_timeout: 120
    timeout: 60
    tools:
      include: [email_meme]
      resources: false
      prompts: false
