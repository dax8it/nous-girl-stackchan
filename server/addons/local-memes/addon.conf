# summary: local meme maker (Hermes MCP): classic templates rendered on your computer with Pillow, no cloud, no keys
hermes hermes/nousgirl_localmeme_mcp.py local-memes/nousgirl_localmeme_mcp.py
hermes hermes/meme_save.py local-memes/meme_save.py
hermes hermes/templates.json local-memes/templates.json
note Download the blank template pictures once: uv run --no-project --python 3.12 --with pillow --with pyyaml python local-memes/tools/build_templates.py
note Add the block from config-snippet.yaml to your Hermes profile config.yaml, and soul.md to SOUL.md. Set NG_MEME_BLOCKED_NAMES to your family's first names.
