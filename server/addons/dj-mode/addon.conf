# summary: DJ set lists: an example set in data/setlists (code is in patched-server)
server files/data/setlists/01-example-set.json data/setlists/01-example-set.json
note Put your songs in the server's music folder (./music in docker-compose.example.yml).
note Edit data/setlists/01-example-set.json so each "track" names one of your songs, then say "DJ mode one".
note Add soul.md from this add-on to your SOUL.md so the brain knows the DJ words.
