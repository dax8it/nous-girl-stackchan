# summary: her own email inbox through AgentMail's hosted MCP server (config template, nothing to copy)
note Create an inbox and an API key in your own AgentMail account.
note Put AGENTMAIL_API_KEY in the profile .env (see ../hermes-profile/.env.example). Never in config.yaml or git.
note Add config-snippet.yaml to the profile config.yaml and soul.md to SOUL.md (write your inbox address there), then restart the gateway.
