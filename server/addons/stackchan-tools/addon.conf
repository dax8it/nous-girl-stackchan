hermes hermes/stackchan_mcp.py stackchan-tools/stackchan_mcp.py
note Add the block from config-snippet.yaml to your Hermes profile config.yaml (fix the path to stackchan_mcp.py).
note Put HG_BRIDGE_TOKEN in the profile .env (same value as hg_bridge.token in data/.config.yaml). See ../hermes-profile/.env.example.
note Add soul.md to SOUL.md, then restart the gateway: hermes -p <profile> gateway restart
